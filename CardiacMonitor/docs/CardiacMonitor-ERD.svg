<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">Cardiac Monitor Database ERD</title>
  <desc id="desc">Entity relationship diagram showing ASP.NET Identity users and roles, patients, vital signs, medications, appointments, and refresh tokens.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .entity { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .head-core { fill: #0f766e; }
      .head-identity { fill: #4338ca; }
      .entity-title { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .field { font: 14px Consolas, 'Courier New', monospace; fill: #1e293b; }
      .field-muted { font: 13px Consolas, 'Courier New', monospace; fill: #64748b; }
      .pk { font-weight: 700; fill: #b45309; }
      .fk { font-weight: 700; fill: #0369a1; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .rel { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 5; stroke-linejoin: round; }
      .cardinality { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #0f172a; paint-order: stroke; stroke: #f8fafc; stroke-width: 5; }
      .legend { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .legend-text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .note { font: 13px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1300"/>
  <text class="title" x="70" y="58">Cardiac Monitor Database — Entity Relationship Diagram</text>
  <text class="subtitle" x="70" y="88">Derived from AppDbContext, domain models, and ASP.NET Core Identity configuration</text>

  <!-- Relationship lines behind entities -->
  <path class="line" d="M 570 350 C 545 350, 575 565, 540 565"/>
  <text class="rel" x="548" y="440">has roles</text>
  <text class="cardinality" x="548" y="365">1</text>
  <text class="cardinality" x="542" y="553">0..*</text>

  <path class="line" d="M 355 420 L 355 485"/>
  <text class="rel" x="365" y="457">role</text>
  <text class="cardinality" x="332" y="438">1</text>
  <text class="cardinality" x="327" y="480">0..*</text>

  <path class="line-dash" d="M 860 430 L 860 520"/>
  <text class="rel" x="875" y="480">optional user profile · CASCADE</text>
  <text class="cardinality" x="834" y="450">0..1</text>
  <text class="cardinality" x="834" y="512">0..1</text>

  <path class="line" d="M 1150 270 C 1215 270, 1210 295, 1270 295"/>
  <text class="rel" x="1168" y="250">owns · CASCADE</text>
  <text class="cardinality" x="1133" y="260">1</text>
  <text class="cardinality" x="1238" y="283">0..*</text>

  <path class="line" d="M 1150 385 C 1210 520, 1080 820, 1160 1000"/>
  <text class="rel" x="1172" y="610">doctor · RESTRICT</text>
  <text class="cardinality" x="1134" y="380">1</text>
  <text class="cardinality" x="1132" y="990">0..*</text>

  <path class="line" d="M 680 835 C 635 875, 485 885, 485 930"/>
  <text class="rel" x="570" y="882">has · CASCADE</text>
  <text class="cardinality" x="654" y="846">1</text>
  <text class="cardinality" x="458" y="920">0..*</text>

  <path class="line" d="M 860 835 L 860 965"/>
  <text class="rel" x="875" y="912">has · CASCADE</text>
  <text class="cardinality" x="835" y="854">1</text>
  <text class="cardinality" x="833" y="955">0..*</text>

  <path class="line" d="M 1040 835 C 1120 875, 1355 840, 1355 875"/>
  <text class="rel" x="1115" y="857">has · CASCADE</text>
  <text class="cardinality" x="1022" y="848">1</text>
  <text class="cardinality" x="1327" y="865">0..*</text>

  <!-- AspNetRoles -->
  <g transform="translate(70 170)">
    <rect class="entity" width="410" height="250" rx="10"/>
    <path class="head-identity" d="M10 0 H400 A10 10 0 0 1 410 10 V52 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="entity-title" x="20" y="33">AspNetRoles</text>
    <text class="field pk" x="20" y="82">PK  Id : nvarchar(450)</text>
    <text class="field" x="20" y="110">    Name : nvarchar(256)?</text>
    <text class="field" x="20" y="138">    NormalizedName : nvarchar(256)?</text>
    <text class="field" x="20" y="166">    ConcurrencyStamp : nvarchar(max)?</text>
    <line x1="20" y1="190" x2="390" y2="190" stroke="#e2e8f0"/>
    <text class="field-muted" x="20" y="220">Seed: Admin, Doctor, Patient</text>
  </g>

  <!-- AspNetUserRoles -->
  <g transform="translate(170 485)">
    <rect class="entity" width="370" height="165" rx="10"/>
    <path class="head-identity" d="M10 0 H360 A10 10 0 0 1 370 10 V52 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="entity-title" x="20" y="33">AspNetUserRoles</text>
    <text class="field pk" x="20" y="84">PK, FK  UserId : nvarchar(450)</text>
    <text class="field pk" x="20" y="116">PK, FK  RoleId : nvarchar(450)</text>
    <text class="field-muted" x="20" y="145">Composite primary key</text>
  </g>

  <!-- AspNetUsers -->
  <g transform="translate(570 130)">
    <rect class="entity" width="580" height="300" rx="10"/>
    <path class="head-identity" d="M10 0 H570 A10 10 0 0 1 580 10 V52 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="entity-title" x="20" y="33">AspNetUsers</text>
    <text class="field pk" x="20" y="82">PK  Id : nvarchar(450)</text>
    <text class="field" x="20" y="110">    UserName / NormalizedUserName</text>
    <text class="field" x="20" y="138">    Email / NormalizedEmail</text>
    <text class="field" x="20" y="166">    EmailConfirmed : bit</text>
    <text class="field" x="20" y="194">    PasswordHash / SecurityStamp</text>
    <text class="field" x="20" y="222">    PhoneNumber / PhoneNumberConfirmed</text>
    <text class="field" x="20" y="250">    TwoFactorEnabled / LockoutEnd</text>
    <text class="field" x="20" y="278">    LockoutEnabled / AccessFailedCount</text>
  </g>

  <!-- RefreshTokens -->
  <g transform="translate(1270 130)">
    <rect class="entity" width="460" height="330" rx="10"/>
    <path class="head-core" d="M10 0 H450 A10 10 0 0 1 460 10 V52 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="entity-title" x="20" y="33">RefreshTokens</text>
    <text class="field pk" x="20" y="82">PK  Id : int</text>
    <text class="field fk" x="20" y="110">FK  UserId : nvarchar(450)</text>
    <text class="field" x="20" y="138">    Token : nvarchar(max)</text>
    <text class="field" x="20" y="166">    JwtId : nvarchar(max)</text>
    <text class="field" x="20" y="194">    IsUsed : bit</text>
    <text class="field" x="20" y="222">    IsRevoked : bit</text>
    <text class="field" x="20" y="250">    AddedDate : datetime2</text>
    <text class="field" x="20" y="278">    ExpiryDate : datetime2</text>
    <text class="field-muted" x="20" y="310">Single-use refresh-token rotation</text>
  </g>

  <!-- Patients -->
  <g transform="translate(680 520)">
    <rect class="entity" width="360" height="315" rx="10"/>
    <path class="head-core" d="M10 0 H350 A10 10 0 0 1 360 10 V52 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="entity-title" x="20" y="33">Patients</text>
    <text class="field pk" x="20" y="82">PK  Id : int</text>
    <text class="field fk" x="20" y="110">FK  UserId : nvarchar(450)?</text>
    <text class="field" x="20" y="138">    FirstName : nvarchar(max)</text>
    <text class="field" x="20" y="166">    LastName : nvarchar(max)</text>
    <text class="field" x="20" y="194">    DateOfBirth : datetime2</text>
    <text class="field" x="20" y="222">    Gender : nvarchar(max)</text>
    <text class="field" x="20" y="250">    ContactNumber : nvarchar(max)</text>
    <line x1="20" y1="272" x2="340" y2="272" stroke="#e2e8f0"/>
    <text class="field-muted" x="20" y="297">UserId is nullable and unique</text>
  </g>

  <!-- VitalSigns -->
  <g transform="translate(70 930)">
    <rect class="entity" width="500" height="320" rx="10"/>
    <path class="head-core" d="M10 0 H490 A10 10 0 0 1 500 10 V52 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="entity-title" x="20" y="33">VitalSigns</text>
    <text class="field pk" x="20" y="82">PK  Id : int</text>
    <text class="field fk" x="20" y="110">FK  PatientId : int</text>
    <text class="field" x="20" y="138">    HeartRate : int</text>
    <text class="field" x="20" y="166">    OxygenSaturation : decimal(5,2)</text>
    <text class="field" x="20" y="194">    SystolicBP : int</text>
    <text class="field" x="20" y="222">    DiastolicBP : int</text>
    <text class="field" x="20" y="250">    RecordedAt : datetime2</text>
    <text class="field-muted" x="20" y="290">Cardiac reading captured at a point in time</text>
  </g>

  <!-- Medications -->
  <g transform="translate(620 965)">
    <rect class="entity" width="480" height="285" rx="10"/>
    <path class="head-core" d="M10 0 H470 A10 10 0 0 1 480 10 V52 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="entity-title" x="20" y="33">Medications</text>
    <text class="field pk" x="20" y="82">PK  Id : int</text>
    <text class="field fk" x="20" y="110">FK  PatientId : int</text>
    <text class="field" x="20" y="138">    Name : nvarchar(max)</text>
    <text class="field" x="20" y="166">    Dosage / Frequency : nvarchar(max)</text>
    <text class="field" x="20" y="194">    StartDate : datetime2</text>
    <text class="field" x="20" y="222">    EndDate : datetime2?</text>
    <text class="field" x="20" y="250">    IsActive : bit</text>
  </g>

  <!-- Appointments -->
  <g transform="translate(1160 875)">
    <rect class="entity" width="570" height="300" rx="10"/>
    <path class="head-core" d="M10 0 H560 A10 10 0 0 1 570 10 V52 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="entity-title" x="20" y="33">Appointments</text>
    <text class="field pk" x="20" y="82">PK  Id : int</text>
    <text class="field fk" x="20" y="110">FK  PatientId : int</text>
    <text class="field fk" x="20" y="138">FK  DoctorId : nvarchar(450)</text>
    <text class="field" x="20" y="166">    AppointmentDate : datetime2</text>
    <text class="field" x="20" y="194">    Status : nvarchar(max)</text>
    <text class="field" x="20" y="222">    Notes : nvarchar(max)?</text>
    <line x1="20" y1="244" x2="550" y2="244" stroke="#e2e8f0"/>
    <text class="field-muted" x="20" y="272">Status: Scheduled | Completed | Cancelled</text>
  </g>

  <!-- Legend -->
  <g transform="translate(70 690)">
    <rect class="legend" width="480" height="170" rx="10"/>
    <text x="20" y="34" style="font:700 16px 'Segoe UI',Arial;fill:#0f172a">Legend</text>
    <text class="legend-text" x="20" y="64"><tspan class="pk">PK</tspan><tspan> — Primary key</tspan></text>
    <text class="legend-text" x="20" y="92"><tspan class="fk">FK</tspan><tspan> — Foreign key</tspan></text>
    <text class="legend-text" x="20" y="120">1 → 0..* — One-to-many</text>
    <text class="legend-text" x="20" y="148">0..1 → 0..1 — Optional one-to-one</text>
  </g>

  <text class="note" x="1210" y="1255">ASP.NET Identity auxiliary tables (claims, logins, tokens) are omitted for readability.</text>
</svg>
